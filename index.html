<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money Manager by Ariansyah</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-3">

  <div class="container bg-white p-4 border rounded">
    <h1 class="h3 text-center mb-4">Money Manager by Ariansyah</h1>

    <div class="row text-center mb-4">
      <div class="col-md-4">
        <div class="p-3 border bg-light">
          <h5>Total Saldo</h5>
          <h3 id="balanceValue">Rp 0</h3>
        </div>
      </div>
      <div class="col-md-4">
        <div class="p-3 border bg-light text-success">
          <h5>Pemasukan</h5>
          <h3 id="incomeValue">Rp 0</h3>
        </div>
      </div>
      <div class="col-md-4">
        <div class="p-3 border bg-light text-danger">
          <h5>Pengeluaran</h5>
          <h3 id="expenseValue">Rp 0</h3>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-md-4 mb-4">
        <h4>Tambah Transaksi</h4>
        <form id="transactionForm">
          <div class="mb-2">
            <label>Jenis</label>
            <select id="type" class="form-select">
              <option value="income">Pemasukan</option>
              <option value="expense">Pengeluaran</option>
            </select>
          </div>
          <div class="mb-2">
            <label>Keterangan</label>
            <input type="text" id="description" class="form-control" required>
          </div>
          <div class="mb-2">
            <label>Nominal (Rp)</label>
            <input type="number" id="amount" class="form-control" required>
          </div>
          <div class="mb-3">
            <label>Tanggal</label>
            <input type="date" id="date" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Simpan</button>
        </form>
      </div>

      <div class="col-md-8">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h4>Riwayat Transaksi</h4>
          <select id="filterType" class="form-select w-auto">
            <option value="all">Semua</option>
            <option value="income">Pemasukan</option>
            <option value="expense">Pengeluaran</option>
          </select>
        </div>

        <table class="table table-bordered">
          <thead class="table-secondary">
            <tr>
              <th>Tanggal</th>
              <th>Keterangan</th>
              <th>Jenis</th>
              <th>Nominal</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="transactionRows"></tbody>
        </table>
      </div>
    </div>

    <footer class="text-center mt-4 text-muted border-top pt-3">
      Money Manager by Ariansyah
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
